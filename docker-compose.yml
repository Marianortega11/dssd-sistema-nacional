services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      POSTGRES_DB: nacional
    ports:
      - "5434:5432"
    volumes:
      - nacional_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nacional"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8090:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nacional
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      SISTEMA_PASSWORD: ${SISTEMA_PASSWORD:?Falta SISTEMA_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  nacional_data:
