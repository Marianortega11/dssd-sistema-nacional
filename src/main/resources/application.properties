spring.application.name=sistema-nacional
# Render/Heroku inyectan PORT
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nacional}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (HS256). El secreto debe tener al menos 32 caracteres; en produccion definirlo por variable de entorno.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Datos iniciales (cuentas ADMIN / SISTEMA, certificaciones y ONGs de demo)
app.seed.enabled=${SEED_ENABLED:true}
app.seed.demo=${SEED_DEMO:true}
app.seed.admin-password=${ADMIN_PASSWORD:admin12345}
app.seed.sistema-password=${SISTEMA_PASSWORD:bonita12345}
app.seed.demo-password=${DEMO_PASSWORD:demo12345}

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
